name: 릴스 TTS (OpenAI)
on:
  workflow_dispatch:
    inputs:
      name: { description: "scripts/tts/<name>.json", default: "daytona" }
      voices: { description: "목소리 (쉼표)", default: "nova,shimmer,coral" }
permissions: { contents: write }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q requests
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/tts_openai.py --name "${{ inputs.name }}" --voices "${{ inputs.voices }}"
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add scripts/tts_status.json && git commit -qm "TTS 상태" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          if [ -d tts_out ]; then
            mv tts_out /tmp/tts_out; git fetch origin insta; git checkout -q -B insta origin/insta
            mkdir -p tts && cp -r /tmp/tts_out/* tts/
            git add tts && git commit -qm "TTS $(date +%F)" || exit 0
            for i in 1 2 3; do git push -q origin insta && break; git pull -q --rebase origin insta; done
          fi
