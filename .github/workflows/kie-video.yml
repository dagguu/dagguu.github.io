name: 감성숙소 영상 만들기 (kie Veo)
on:
  workflow_dispatch:
    inputs:
      slug: { description: "숙소 slug (비우면 오늘 글)", default: "" }
      count: { description: "영상 개수 (사진 앞에서부터)", default: "1" }
      only: { description: "사진 번호만 (예: 1,3,5) — 쓰면 count 무시", default: "" }
      tier: { description: "input.model (Lite)", default: "veo3_lite" }
      task: { description: "이미 만든 작업 ID 다시 받기", default: "" }
permissions: { contents: write }
concurrency: { group: kie-video, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: python scripts/kie_video.py --slug "${{ inputs.slug }}" --count "${{ inputs.count }}" --only "${{ inputs.only }}" --tier "${{ inputs.tier }}" --task "${{ inputs.task }}"
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          cp scripts/kie_status.json /tmp/kie_status.json
          git add scripts/kie_status.json && git commit -qm "영상 만들기 상태" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          if [ -d kie_out ]; then
            mv kie_out /tmp/kie_out
            git fetch origin insta
            git checkout -q -B insta origin/insta
            mkdir -p video && cp -r /tmp/kie_out/* video/
            git add video && git commit -qm "감성숙소 영상 $(date +%F)" || exit 0
            for i in 1 2 3; do git push -q origin insta && break; git pull -q --rebase origin insta; done
          fi
