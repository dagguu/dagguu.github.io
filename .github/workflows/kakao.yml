name: 카카오 채널 캐러셀 카드 만들기
on:
  push:
    branches: [main]
    paths: ['scripts/kakao_queue.json']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  make:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji >/dev/null
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python scripts/gen_kakao.py
      # 이미지는 main 을 무겁게 하지 않도록 insta 브랜치 kakao/<날짜>/ 에 올린다
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          mv kakao_out /tmp/kakao_out
          git fetch origin insta
          git checkout -q -B insta origin/insta
          for dd in $(cd /tmp/kakao_out && ls -d *); do rm -rf "kakao/$dd"; mkdir -p "kakao/$dd"; cp /tmp/kakao_out/$dd/* "kakao/$dd"/; done
          git add -A && git commit -qm "카카오 캐러셀 카드 $(date +%F)" || exit 0
          for i in 1 2 3; do git push -q origin insta && break; git pull -q --rebase origin insta; done
