name: 마이리얼트립 특가
on:
  schedule:
    - cron: "40 21 * * *"   # 매일 오전 6:40 (한국)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: mrt, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 숙소 특가 모으기
        env:
          MRT_API_KEY: ${{ secrets.MRT_API_KEY }}
        run: |
          python3 scripts/mrt_api.py
          python3 scripts/gen_share.py
      - name: 저장
        run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add -A
          git diff --cached --quiet || (git commit -m "마이리얼트립 특가 $(TZ=Asia/Seoul date +%F)" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done)
