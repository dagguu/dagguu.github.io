name: 감성숙소 마이리얼트립 할인
on:
  schedule:
    - cron: "55 21 * * *"   # 매일 오전 6:55 (한국)
  push:
    paths: ["scripts/stays/*.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: mrt, cancel-in-progress: false }
jobs:
  update:
    runs-on: [self-hosted, mrt]   # 오라클 도쿄 고정 IP 150.230.201.109 (마이리얼트립 API IP 등록, 2026-11-02)
    steps:
      - uses: actions/checkout@v4
      - name: 숙소별 할인 정보 찾기
        env:
          MRT_API_KEY: ${{ secrets.MRT_API_KEY }}
        run: |
          python3 scripts/mrt_stays.py
          python3 scripts/mrt_stays.py --cand || true
      - name: 저장
        run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          for i in 1 2 3; do
            git add scripts/stay_mrt.json scripts/stay_mrt_status.json scripts/stay_mrt_cand.json
            git stash -q || true
            git pull --rebase -q || true
            git stash pop -q || true
            python3 scripts/gen_stays.py
            git add scripts/stay_mrt.json scripts/stay_mrt_status.json scripts/stay_mrt_cand.json m/ index.html sitemap.xml
            git diff --cached --quiet && break
            git commit -qm "감성숙소 마이리얼트립 할인 $(TZ=Asia/Seoul date +%F)" && git push && break
            sleep 5
          done
