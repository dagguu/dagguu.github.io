name: 다꾸키즈 상품 숏폼 영상
# 2026-11-12 시온님: 상품 사진(모델 착용컷)으로 세로 14초 영상. 수동 실행. 결과 kids/v/
on:
  workflow_dispatch:
    inputs:
      count: { description: "몇 개 (자동 고르기)", default: "5" }
      nos: { description: "상품번호 직접 (쉼표, 비우면 자동)", default: "" }
permissions: { contents: write }
concurrency: kids-video
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null) || echo apt실패
          pip install -q requests pillow
          mkdir -p ~/.local/share/fonts
          for f in SemiBold Bold ExtraBold; do for u in https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/public/static/Pretendard-$f.otf https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/public/static/Pretendard-$f.otf; do curl -sSLf -o ~/.local/share/fonts/Pretendard-$f.otf $u && break; done; done
          curl -sSLf -o ~/.local/share/fonts/NotoSansKR.otf https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/SubsetOTF/KR/NotoSansKR-Bold.otf || true
          which ffmpeg
      - run: python scripts/kids_video.py
        env:
          COUNT: ${{ github.event.inputs.count }}
          NOS: ${{ github.event.inputs.nos }}
      - run: |
          git config user.name "dagguu"; git config user.email "dagguu@users.noreply.github.com"
          git add kids/v
          git commit -qm "다꾸키즈 상품 영상" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
