name: 감성숙소 인물 이미지 (GPT)
on:
  workflow_dispatch:
    inputs:
      slug: { description: "숙소 slug (비우면 오늘 글)", default: "" }
      only: { description: "사진 번호 (예: 1,5)", default: "1" }
      model: { description: "OpenAI 이미지 모델", default: "gpt-image-2.5-sunburst" }
      quality: { description: "low / medium / high", default: "high" }
permissions: { contents: write }
concurrency: { group: gpt-image, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/gpt_image.py --slug "${{ inputs.slug }}" --only "${{ inputs.only }}" --model "${{ inputs.model }}" --quality "${{ inputs.quality }}"
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add scripts/gpt_status.json && git commit -qm "GPT 이미지 상태" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          if [ -d gpt_out ]; then
            mv gpt_out /tmp/gpt_out
            git fetch origin insta
            git checkout -q -B insta origin/insta
            mkdir -p img && cp -r /tmp/gpt_out/* img/
            git add img && git commit -qm "감성숙소 인물 이미지 $(date +%F)" || exit 0
            for i in 1 2 3; do git push -q origin insta && break; git pull -q --rebase origin insta; done
          fi
