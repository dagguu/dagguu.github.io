name: 스레드 vlog 초안 메일 보내기
# @dagguu.vlog 스레드 초안을 시온님 네이버 메일로 보낸다(2026-10-25 시온님 "스레드 글 이메일로 보내줘").
# 글은 저장소에 넣지 않고 실행할 때 입력(base64)으로만 넘긴다. 사진은 주소로 받아 첨부한다.
on:
  workflow_dispatch:
    inputs:
      body: { description: "메일 본문(base64 UTF-8)", required: true }
      photos: { description: "첨부 사진 주소(공백으로 구분)", required: false, default: "" }
      subject: { description: "제목", required: false, default: "[다꾸] 스레드 초안" }
permissions: { contents: read }
jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/mail_vlog.py
        env:
          NAVER_MAIL_ID: ${{ secrets.NAVER_MAIL_ID }}
          NAVER_MAIL_PW: ${{ secrets.NAVER_MAIL_PW }}
          BODY: ${{ inputs.body }}
          PHOTOS: ${{ inputs.photos }}
          SUBJECT: ${{ inputs.subject }}
