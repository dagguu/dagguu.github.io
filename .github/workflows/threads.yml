name: 스레드 예약 글
on:
  # schedule 꺼짐(2026-10-22 18:51 시온님: 스레드 연결 계정의 페이스북이 정지됨) — 예전: 09:17·12:47·21:13 KST
  workflow_dispatch:
    inputs:
      mode: { description: "post 또는 verify(글 안 올리고 연결만 확인)", default: "post" }
permissions: { contents: write }
concurrency: { group: threads, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 scripts/threads_post.py ${{ github.event.inputs.mode == 'verify' && '--verify' || '' }}
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add scripts/threads_*.json && git commit -m "스레드 올린 기록" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
