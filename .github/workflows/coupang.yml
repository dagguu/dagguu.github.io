name: 쿠팡 자동 업데이트
on:
  schedule:
    - cron: "12 22 * * *"   # 매일 오전 7시 12분(한국시간) 골드박스
  push:
    paths: ["data.json"]     # 새 체험단이 올라오면 쿠팡 링크 변환
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: coupang, cancel-in-progress: false }
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 쿠팡 파트너스 API
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python3 scripts/coupang_api.py deeplink; else python3 scripts/coupang_api.py; fi
          python3 scripts/gen_share.py
      - name: 저장
        run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add -A
          git diff --cached --quiet || (git commit -m "쿠팡 자동 업데이트 $(TZ=Asia/Seoul date +%F)" && git push)
