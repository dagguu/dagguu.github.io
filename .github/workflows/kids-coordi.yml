name: 다꾸키즈 같이 코디한 상품 찾기
# 2026-11-22 시온님 "보니토 코디 태그·추가상품": 같은 코디 사진을 함께 쓴 상품 쌍 → scripts/kids_coordi_pairs.json
on:
  workflow_dispatch:
    inputs:
      brand: { description: "브랜드", default: "보니토" }
permissions: { contents: write }
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow
      - run: python scripts/kids_coordi_find.py "${{ inputs.brand }}"
      - run: |
          git config user.name "dagguu"; git config user.email "dagguu@users.noreply.github.com"
          git add scripts/kids_coordi_pairs.json
          git commit -qm "같이 코디한 상품 찾기 ${{ inputs.brand }}" || true
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
