name: 인스타 게시 (@dagguu.home)
on:
  # schedule 꺼짐(2026-10-22 18:51 시온님: 페이스북 계정 정지로 자동 업로드 취소)
  workflow_dispatch:
    inputs:
      mode: { description: "verify(연결만 확인) 또는 post", default: "verify" }
permissions: { contents: write }
concurrency: { group: insta-post, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { INSTA_TOKEN: "${{ secrets.INSTA_TOKEN }}" }
        run: python3 scripts/insta_post.py ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'verify') && '--verify' || '' }}
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add scripts/insta_*.json && git commit -m "인스타 게시 기록" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
