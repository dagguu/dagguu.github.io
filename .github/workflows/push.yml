name: 웹 푸시 알림
on:
  schedule:
    - cron: "1 23 * * *"    # 오전 8:01 (한국) 오늘의 특가
    - cron: "37 23 * * *"   # 오전 8:37 오늘 오픈 체험단
    - cron: "37 0 * * *"    # 오전 9:37 아기용품 핫딜
    - cron: "7 3 * * *"     # 낮 12:07 오늘의 특가
    - cron: "7 6 * * *"     # 오후 3:07 관심 지역·단어 맞춤 (오후 등록 뒤, 관심 맞는 사람만)
    - cron: "7 9 * * *"     # 저녁 6:07 오늘 마감
    - cron: "37 10 * * *"   # 저녁 7:37 저녁 등록분 관심 맞춤
    - cron: "50 11 * * *"   # 밤 8:50 오늘 마감 한 번 더 (9시 넘으면 안 보냄)
  workflow_dispatch:
    inputs:
      slot: { description: "morning / noon / match / evening / night / toss / hotdeal / mdeal / evening2 / test", default: "morning" }
permissions: { contents: read }
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save web-push@3.6.7
      - name: 보내기
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then case "${{ github.event.schedule }}" in
            "1 23 * * *") S=mdeal;; "50 11 * * *") S=evening2;;
            "37 23 * * *") S=morning;; "37 0 * * *") S=hotdeal;; "7 3 * * *") S=noon;; "7 6 * * *") S=match;; "7 9 * * *") S=evening;; "37 10 * * *") S=night;; "7 11 * * *") S=toss;; *) S=test;; esac; fi
          node scripts/send_push.js "$S"
