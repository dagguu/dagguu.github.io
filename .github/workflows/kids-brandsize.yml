name: 다꾸키즈 브랜드별 사이즈표
on:
  schedule:
    - cron: "23 3 * * *"   # 매일 12:23 KST (쇼핑몰 10:37 신상 등록 뒤)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kids-brandsize
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/kids_brand_size.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add kids/brand_size.json
          git diff --cached --quiet && exit 0
          git commit -m "다꾸키즈 브랜드별 사이즈표 자료"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
