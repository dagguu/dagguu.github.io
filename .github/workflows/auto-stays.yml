name: 숙박 체험단 자동 등록
on:
  workflow_dispatch:
    inputs:
      since: { description: "시작일 이후 (YYYY-MM-DD, 비우면 어제)", required: false, default: "" }
permissions: { contents: write }
concurrency: { group: auto-stays, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/auto_stays.py ${{ inputs.since }}
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add data.json scripts/auto_stays_last.json && git commit -qm "숙박 체험단 자동 등록 (인플렉서) $(TZ=Asia/Seoul date +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
