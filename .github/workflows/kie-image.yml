name: 감성숙소 인물 이미지 (kie)
on:
  workflow_dispatch:
    inputs:
      slug: { description: "숙소 slug (비우면 오늘 글)", default: "" }
      only: { description: "사진 번호 (예: 1,3) — 비우면 img 프롬프트 전부", default: "" }
      model: { description: "google/nano-banana-edit(4크레딧) · nano-banana-pro(18) · bytedance/seedream-v4-edit", default: "google/nano-banana-edit" }
      res: { description: "1K / 2K / 4K", default: "2K" }
      tasks: { description: "이미 만든 결과 다시 받기 (1:taskId,5:taskId)", default: "" }
permissions: { contents: write }
concurrency: { group: kie-image, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: python scripts/kie_image.py --slug "${{ inputs.slug }}" --only "${{ inputs.only }}" --model "${{ inputs.model }}" --res "${{ inputs.res }}" --tasks "${{ inputs.tasks }}"
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add scripts/kie_img_status.json && git commit -qm "kie 이미지 상태" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          if [ -d kie_img ]; then
            mv kie_img /tmp/kie_img
            git fetch origin insta
            git checkout -q -B insta origin/insta
            mkdir -p img && cp -r /tmp/kie_img/* img/
            git add img && git commit -qm "kie 인물 이미지 $(date +%F)" || exit 0
            for i in 1 2 3; do git push -q origin insta && break; git pull -q --rebase origin insta; done
          fi
