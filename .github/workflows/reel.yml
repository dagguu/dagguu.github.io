name: 릴스 만들기 (대본 장면 ↔ 사진)
on:
  workflow_dispatch:
    inputs:
      name: { description: "scripts/tts/<name>.json (scenes 필요)", default: "daytona" }
      thumb: { description: "y = 썸네일만 다시 (음성·영상 X)", default: "" }
permissions: { contents: write }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          if command -v ffmpeg >/dev/null && ffmpeg -hide_banner -filters 2>/dev/null | grep -q subtitles; then echo "ffmpeg 있음"; exit 0; fi
          for i in 1 2 3; do
            if [ $i -ge 2 ]; then sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g; s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true; fi
            sudo timeout -k 10 150 apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=2
            sudo timeout -k 10 240 apt-get install -y -qq --no-install-recommends -o Acquire::http::Timeout=20 -o Acquire::Retries=2 ffmpeg >/dev/null && break
            echo "apt 재시도 $i"; sleep 10
          done
          sudo timeout -k 5 120 apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null 2>&1 || echo "noto 건너뜀"
          which ffmpeg
        timeout-minutes: 20
      - run: pip install -q requests pillow fonttools && timeout 240 python scripts/get_font.py; git fetch -q origin insta
      - env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
        run: python scripts/reel_make.py --name "${{ inputs.name }}" ${{ inputs.thumb == 'y' && '--thumb-only' || '' }}
      - run: |
          git config user.name "dagguu"; git config user.email "eun901002@gmail.com"
          git add scripts/reel_status.json && git commit -qm "릴스 상태" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          if [ -f reel_out/${{ inputs.name }}/reel.mp4 ] || [ -f reel_out/${{ inputs.name }}/thumb.jpg ]; then
            mv reel_out /tmp/reel_out; git checkout -q -B insta origin/insta
            mkdir -p reels && cp -r /tmp/reel_out/* reels/
            git add reels && git commit -qm "릴스 $(date +%F)" || exit 0
            for i in 1 2 3; do git push -q origin insta && break; git pull -q --rebase origin insta; done
          fi
