<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>알림 키 만들기</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}textarea{width:100%;height:64px;font-family:monospace;font-size:13px}button{padding:10px 16px;font-size:15px;border-radius:10px;border:0;background:#6a3fc8;color:#fff}.w{background:#fff4e5;padding:10px;border-radius:8px}</style></head><body>
<h1>🔔 알림 키 만들기</h1>
<p>이 페이지는 <b>이 브라우저 안에서만</b> 키를 만들어요. 어디로도 전송되지 않아요.</p>
<button id="g">키 만들기</button>
<h3>① 공개 키 (Claude 에게 보내 주세요)</h3><textarea id="pub" readonly></textarea>
<h3>② 비밀 키 (GitHub Secrets 에만 넣기)</h3><textarea id="pri" readonly></textarea>
<p class="w">비밀 키는 채팅·메일에 붙이지 마세요. GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret → 이름 <b>VAPID_PRIVATE_KEY</b> 로 넣어 주세요. 넣은 뒤 이 페이지는 닫으면 돼요.</p>
<script>
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('g').onclick=async()=>{
  const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);
  const raw=await crypto.subtle.exportKey('raw',k.publicKey); const jwk=await crypto.subtle.exportKey('jwk',k.privateKey);
  document.getElementById('pub').value=b64(raw); document.getElementById('pri').value=jwk.d;
};
</script></body></html>
